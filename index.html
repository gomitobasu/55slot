<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAPPY 55 スロット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&family=Orbitron:wght@700;900&display=swap">
<style>
/* Layout: the front of a pachislot machine filling a fixed 1600x900 (16:9) stage that scales to the window.
   Silver top bar, chrome pillars, red reel panel (bet lines left, status lamps right, LEDs bottom center, 55 lamp lower-left),
   then the silver control deck (BET, lever, three stop buttons, settle, medal slot). FX layers sit fixed above. Single dark look. */
:root{
  --bg:#05030b;
  --red:#e0101c; --red-deep:#8a0010; --navy:#14206a; --gold:#ffd23a; --gold-lo:#a86a00;
  --hot:#ff2e7e; --cyan:#43f0ff; --ink:#fbf4ff; --mute:#8d8a99;
  --chrome-a:#fbfbfd; --chrome-b:#b9bcc6; --chrome-c:#6e717c; --deck-dark:#16161a;
  --seg:#ff3dbb; --seg-off:#2a1240;
  --reel:#ffffff; --reel-shade:#c8c8cc;
  --f-disp:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-led:"Orbitron","Courier New",monospace;
  --s:1;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0; overflow:hidden; background:var(--bg); color:var(--ink); font-family:var(--f-body)}

.scene{position:fixed; left:50%; top:50%; width:1600px; height:900px; transform:translate(-50%,-50%) scale(var(--s)); transform-origin:50% 50%; overflow:hidden; z-index:2; background:#0c0c10}
.shaker{position:absolute; inset:0}
.shaker.vibe{animation:vibe .045s linear infinite}
@keyframes vibe{0%{transform:translate(2px,0)} 33%{transform:translate(-2px,1px)} 66%{transform:translate(1px,-2px)} 100%{transform:translate(-1px,1px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes hue{to{filter:hue-rotate(360deg)}}

/* ---------- cabinet frame ---------- */
.topbar{position:absolute; left:0; right:0; top:0; height:40px; background:linear-gradient(180deg,#d9dbe2,var(--chrome-a) 30%,var(--chrome-b) 80%,#7d808a)}
.pillar{position:absolute; top:40px; height:610px; width:92px; border-radius:46px/18px;
  background:linear-gradient(90deg,#5d6069,#c9ccd4 18%,#ffffff 34%,#b5b8c2 55%,#7b7e88 80%,#4b4e57)}
.pillar.l{left:18px} .pillar.r{right:18px}
.pillar::after{content:""; position:absolute; left:40px; width:12px; top:40px; bottom:40px; border-radius:6px; opacity:0; background:linear-gradient(180deg,#ff2e7e,#ffd84a,#4dff88,#43f0ff,#7b5bff,#ff2e7e); background-size:100% 200%}
body.fever .pillar::after{opacity:1; box-shadow:0 0 18px #fff; animation:sideflow .5s linear infinite}
@keyframes sideflow{to{background-position:0 200%}}
.lip{position:absolute; left:0; right:0; top:648px; height:36px; background:linear-gradient(180deg,#000,#1d1d22 40%,#3a3b42)}
.lip::after{content:""; position:absolute; left:120px; right:120px; top:4px; height:24px; opacity:.18; background:linear-gradient(90deg,transparent,#ff3030 20%,#ffd23a 50%,#ff3030 80%,transparent); filter:blur(3px)}

/* ---------- red reel panel ---------- */
.panel{position:absolute; left:110px; right:110px; top:40px; height:608px; overflow:hidden;
  background:
    radial-gradient(circle at 12% 70%, rgba(255,230,120,.6) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 20%, rgba(255,255,255,.55) 0 2px, transparent 3px),
    radial-gradient(60% 80% at 50% 50%, #ff3a2a, var(--red) 45%, var(--red-deep));
  background-size:58px 58px, 74px 74px, 100% 100%;
  box-shadow:inset 0 0 0 3px #3a0006, inset 0 18px 30px rgba(0,0,0,.35)}
.sunburst{position:absolute; left:50%; top:52%; width:2000px; height:2000px; margin:-1000px 0 0 -1000px; pointer-events:none;
  background:repeating-conic-gradient(rgba(255,210,58,.13) 0 7deg, transparent 7deg 14deg); animation:spin 60s linear infinite}
body.fever .sunburst{animation-duration:4s; background:repeating-conic-gradient(rgba(255,240,160,.3) 0 7deg, transparent 7deg 14deg)}
.ribbon{position:absolute; left:-40px; right:-40px; top:290px; height:190px; border-radius:50%; background:linear-gradient(180deg,#2433a0,var(--navy)); box-shadow:0 0 0 6px var(--gold), 0 0 0 9px #7a3a00}

/* pay table */
.paytable{position:absolute; left:250px; right:250px; top:12px; height:96px; display:grid; grid-template-columns:1fr auto 1fr; gap:28px; align-items:center}
.pt-col{display:grid; gap:4px}
.pt{display:flex; align-items:center; gap:6px; font-family:var(--f-led); font-weight:900; font-size:22px; color:#fff; text-shadow:0 2px 0 #600}
.pt svg{width:38px; height:38px}
.pt b{color:var(--gold); min-width:30px; text-align:right}
.pt.r{justify-content:flex-end}
.pt-big{text-align:center}
.pt-big .ttl{white-space:nowrap; font-family:var(--f-disp); font-size:30px; letter-spacing:.06em; color:var(--gold); -webkit-text-stroke:2px #6a2a00; paint-order:stroke fill; text-shadow:0 3px 0 #500}
.pt-big .sub{margin-top:6px; display:flex; justify-content:center; gap:8px; align-items:center; font-family:var(--f-led); font-weight:900; font-size:22px; color:#fff}
.pt-big .sub i{font-style:normal; font-family:var(--f-disp); font-size:16px; padding:4px 8px; border-radius:5px; color:#fff3b0; background:var(--c)}

/* reels */
.reelframe{position:absolute; left:330px; top:116px; width:720px; height:396px; box-sizing:border-box; padding:12px; border-radius:16px; isolation:isolate;
  background:linear-gradient(180deg,#fff3a0,var(--gold) 30%,#e09a00 70%,#ffe680); box-shadow:0 0 0 3px #7a4a00, 0 8px 20px rgba(0,0,0,.45)}
.reelframe::after{content:""; position:absolute; inset:-18px; z-index:-1; border-radius:28px; opacity:0; transition:opacity .3s; background:conic-gradient(#ff2e7e,#ffd84a,#4dff88,#43f0ff,#7b5bff,#ff2e7e); filter:blur(12px)}
body.fever .reelframe::after{opacity:1; animation:hueblur 1.2s linear infinite}
@keyframes hueblur{from{filter:blur(12px) hue-rotate(0deg)} to{filter:blur(12px) hue-rotate(360deg)}}
.reelbox{position:relative; width:696px; height:372px}
.reels{position:absolute; inset:0; display:grid; grid-template-columns:repeat(3,220px); gap:18px; background:#0a0a0a}
.reel{position:relative; height:372px; overflow:hidden; background:linear-gradient(90deg,var(--reel-shade),var(--reel) 18%,var(--reel) 82%,var(--reel-shade))}
.reel::after{content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0) 20%,rgba(0,0,0,0) 80%,rgba(0,0,0,.55))}
.strip{position:absolute; left:0; right:0; top:0; will-change:transform}
.sym{height:124px; display:flex; align-items:center; justify-content:center; overflow:hidden}
.sym svg{display:block; flex:none; width:96px; height:96px}
.sym svg.wide{width:154px; height:77px}
.word{font-family:var(--f-disp); font-size:31px; line-height:1; padding:11px 12px 10px; border-radius:9px; white-space:nowrap; color:#fff3b0;
  text-shadow:0 2px 0 rgba(60,0,30,.8), 0 0 6px rgba(255,240,150,.8); box-shadow:0 0 0 2px #fff3b0, 0 0 0 5px var(--wb), 0 4px 10px rgba(0,0,0,.35); background:linear-gradient(180deg,var(--wa),var(--wb))}
.w-happy{--wa:#ff6fae; --wb:#c3005a} .w-birth{--wa:#9c7bff; --wb:#4a1fc0} .w-day{--wa:#ffad3b; --wb:#d14a00}
.sym.hit{animation:symhit .7s cubic-bezier(.2,1.6,.4,1) both}
.sym.hit .word{animation:wordglow .3s steps(2) infinite}
@keyframes symhit{0%{transform:scale(1.6); filter:brightness(2.4)} 100%{transform:scale(1); filter:none}}
@keyframes wordglow{50%{box-shadow:0 0 0 2px #fff, 0 0 0 5px var(--wb), 0 0 26px 8px #fff}}
.plines{position:absolute; inset:0; z-index:3; pointer-events:none; overflow:visible}
.plines polyline{fill:none; stroke:#ff2e7e; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; opacity:0; filter:drop-shadow(0 0 6px #ff2e7e)}
.plines polyline.on{animation:lineblink .2s steps(2) infinite}
.plines polyline.big{stroke:#fff; stroke-width:10; filter:drop-shadow(0 0 10px #ff2e7e) drop-shadow(0 0 22px #ffd84a); animation:lineblink .2s steps(2) infinite, hue .6s linear infinite}
@keyframes lineblink{0%{opacity:1} 50%{opacity:.25}}

/* bet line numerals (left) */
.betlines{position:absolute; left:84px; top:124px; width:130px; display:grid; gap:0; justify-items:center}
.betlines b{font-family:var(--f-disp); font-weight:400; font-size:82px; line-height:1.03; color:#5a0a10; -webkit-text-stroke:3px #3a0006; paint-order:stroke fill; transition:color .05s}
.betlines b.on{color:var(--c); -webkit-text-stroke:4px #fff; text-shadow:0 5px 0 rgba(0,0,0,.45), 0 0 26px var(--c)}

/* status lamps (right) */
.status{position:absolute; right:44px; top:132px; width:250px; display:grid; gap:10px; justify-items:end}
.status b{font-family:var(--f-disp); font-weight:400; font-size:40px; line-height:1.08; text-align:right; color:#64101a; -webkit-text-stroke:2px #3a0006; paint-order:stroke fill}
.status b.small{font-size:31px}
.status b.on{color:var(--c); -webkit-text-stroke:3px #111; text-shadow:0 0 18px var(--c)}

/* 55 lamp (lower-left) */
.lamp{position:absolute; left:34px; top:402px; width:260px; height:176px; display:grid; place-items:center; border-radius:88px; overflow:hidden;
  background:radial-gradient(circle at 50% 40%, #2a0a30, #0c0210 75%); box-shadow:inset 0 0 0 4px #555, inset 0 0 0 8px #1a1420, 0 0 0 3px var(--gold-lo), 0 8px 18px rgba(0,0,0,.5)}
.lamp b{font-family:var(--f-disp); font-weight:400; font-size:118px; line-height:1; color:#3c1230; letter-spacing:-.02em; transform:translateY(-.08em)}
.lamp small{position:absolute; bottom:12px; font-family:var(--f-led); font-weight:900; font-size:13px; letter-spacing:.4em; color:#4a2040}
.lamp.on{animation:lamphue 1.4s linear infinite; background:radial-gradient(circle at 50% 45%, #fff 0%, #ffe3f0 16%, #ff2e7e 52%, #8a0033 100%);
  box-shadow:inset 0 0 0 4px #fff, 0 0 40px 14px var(--hot), 0 0 120px 50px rgba(255,46,126,.6)}
.lamp.on b{color:#fff; text-shadow:0 0 8px #fff, 0 0 22px var(--hot), 0 0 50px var(--hot)}
.lamp.on small{color:#fff}
.lamp.on::after{content:""; position:absolute; inset:-40%; background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.8) 50%,transparent 60%); animation:glint 1.1s linear infinite}
@keyframes lamphue{to{filter:hue-rotate(360deg) saturate(1.4)}}
@keyframes glint{from{transform:translateX(-60%)} to{transform:translateX(60%)}}

/* LEDs (bottom center) */
.leds{position:absolute; left:420px; right:420px; top:520px; display:grid; grid-template-columns:1fr 1.3fr 1fr; gap:26px; align-items:start}
.led{display:flex; flex-direction:column; align-items:center; gap:4px}
.led .box{position:relative; padding:4px 12px; border-radius:6px; background:#0a0618; box-shadow:0 0 0 3px #1e5bd8, 0 0 0 5px #0a1a50, inset 0 0 12px rgba(0,0,0,.8)}
.led .ghost,.led output{font-family:var(--f-led); font-weight:900; font-size:42px; line-height:1.05; font-variant-numeric:tabular-nums; letter-spacing:.06em}
.led .ghost{color:var(--seg-off)}
.led output{position:absolute; right:12px; top:4px; color:var(--seg); text-shadow:0 0 8px var(--seg), 0 0 18px rgba(255,61,187,.6)}
.led span{font-family:var(--f-disp); font-size:19px; color:var(--gold); -webkit-text-stroke:2px #3a1a00; paint-order:stroke fill; letter-spacing:.04em}

/* birthday art (lower-right) */
.bday{position:absolute; right:40px; top:420px; width:270px; height:175px}
.bday svg{position:absolute; left:0; bottom:0; width:150px; height:150px}
.bubble{position:absolute; right:0; top:4px; max-width:170px; padding:8px 12px; border-radius:16px; background:#fff; color:#d4001c; font-family:var(--f-disp); font-size:17px; line-height:1.25; text-align:center; box-shadow:0 4px 0 rgba(0,0,0,.25); transform:rotate(-4deg)}
.bubble::after{content:""; position:absolute; left:16px; bottom:-12px; border:8px solid transparent; border-top-color:#fff; border-left-width:2px}

/* ---------- control deck ---------- */
.deck{position:absolute; left:0; right:0; top:684px; bottom:0; background:linear-gradient(180deg,#f2f3f6,#c9ccd4 45%,#9da0aa)}
.deck::before{content:""; position:absolute; left:0; right:0; top:0; height:10px; background:linear-gradient(#ffffff,#d5d7de)}
.housing{position:absolute; background:linear-gradient(180deg,#2a2a30,var(--deck-dark)); box-shadow:inset 0 2px 0 #444, 0 3px 0 #fff}
.h-bet{left:20px; top:40px; width:240px; height:136px; clip-path:polygon(0 0,82% 0,100% 50%,82% 100%,0 100%)}
.h-stops{left:470px; top:34px; width:660px; height:150px; clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%)}
.h-settle{left:1180px; top:52px; width:120px; height:112px; clip-path:polygon(20% 0,80% 0,100% 50%,80% 100%,20% 100%,0 50%)}
.h-slot{left:1340px; top:40px; width:240px; height:136px; clip-path:polygon(18% 0,100% 0,100% 100%,18% 100%,0 50%)}
.btn{position:absolute; border-radius:50%; transition:transform .06s, filter .06s}
.btn.press{transform:translateY(5px) scale(.97); filter:brightness(.85)}
.b-bet{left:70px; top:66px; width:84px; height:84px; background:radial-gradient(circle at 40% 35%, #fff, #c9cdd8 60%, #8a8e99); box-shadow:0 0 0 8px #3a3a42, 0 0 0 10px #111}
.b-bet.lit{box-shadow:0 0 0 8px #3a3a42, 0 0 0 10px #111, 0 0 26px 8px rgba(120,200,255,.8)}
.b-credit{left:190px; top:150px; width:40px; height:40px; background:radial-gradient(circle at 40% 35%, #ff6060, #b00010 70%); box-shadow:0 0 0 5px #222}
.lab{position:absolute; font-family:var(--f-led); font-weight:900; font-size:12px; letter-spacing:.14em; color:#555864}
.lever{position:absolute; left:300px; top:42px; width:130px; height:130px; border-radius:50%; background:radial-gradient(circle,#9a9ca6,#4a4c55 70%); box-shadow:0 0 0 6px #d9dbe2, 0 6px 10px rgba(0,0,0,.4)}
.lever i{position:absolute; left:16px; top:10px; width:98px; height:98px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #777, #1a1a1a 55%, #000); box-shadow:0 8px 12px rgba(0,0,0,.6); transition:transform .07s}
.lever.press i{transform:translateY(22px) scale(.94)}
.b-stop{width:124px; height:124px; top:47px; background:radial-gradient(circle at 42% 35%, #fff, #d6d9e2 55%, #9a9eaa); box-shadow:0 0 0 9px #3a0a0e, 0 0 0 12px #111}
.b-stop.live{box-shadow:0 0 0 9px #ff1a2a, 0 0 0 12px #111, 0 0 28px 8px rgba(255,30,40,.85)}
.b-stop.s0{left:567px} .b-stop.s1{left:738px} .b-stop.s2{left:909px}
.settle{position:absolute; left:1196px; top:62px; width:88px; height:88px; border-radius:50%; background:radial-gradient(circle at 40% 35%, #555, #111); box-shadow:0 0 0 4px #888}
.settle::before,.settle::after{content:""; position:absolute; left:30px; border:14px solid transparent}
.settle::before{top:8px; border-bottom:18px solid #9a9ca6; border-top:0}
.settle::after{bottom:8px; border-top:18px solid #9a9ca6; border-bottom:0}
.slot{position:absolute; left:1410px; top:66px; width:88px; height:88px; border-radius:50%; background:radial-gradient(circle,#4a4c55,#18181c); box-shadow:0 0 0 4px #777}
.slot::after{content:""; position:absolute; left:36px; top:16px; width:16px; height:56px; border-radius:8px; background:#000; box-shadow:inset 0 0 0 3px #888}

/* ---------- name panel ---------- */
.namebox{position:absolute; left:500px; top:260px; width:600px; z-index:20; box-sizing:border-box; padding:24px; border-radius:16px; display:grid; gap:12px; background:#140a24; box-shadow:0 0 0 2px #4a2f74, 0 30px 80px rgba(0,0,0,.8); font-size:15px; line-height:1.7}
.namebox h2{margin:0; font-family:var(--f-disp); font-weight:400; font-size:20px; color:var(--gold)}
.namebox label{display:grid; gap:6px; color:#b9b0cc; font-size:13px}
.namebox input{font:inherit; font-size:18px; color:var(--ink); background:#0b0616; border:1px solid #4a2f74; border-radius:10px; padding:10px 12px}
.namebox input:focus-visible{outline:3px solid var(--cyan); outline-offset:2px}
.namebox p{margin:0}
.namebox kbd{font-family:var(--f-led); font-size:12px; background:#2a1747; border:1px solid #4a2f74; border-radius:5px; padding:1px 6px; color:var(--gold)}

/* ---------- FX layers ---------- */
.rays-wrap{position:fixed; inset:0; overflow:hidden; z-index:1; pointer-events:none}
.rays{position:absolute; inset:-60%; opacity:0; transition:opacity .6s}
body.party .rays{opacity:1; animation:spin 4s linear infinite; background:repeating-conic-gradient(hsla(330,100%,60%,.4) 0deg 10deg, hsla(48,100%,60%,.4) 10deg 20deg, hsla(190,100%,60%,.35) 20deg 30deg)}
#fx{position:fixed; inset:0; width:100%; height:100%; z-index:60; pointer-events:none}
.flash{position:fixed; inset:0; z-index:70; background:#fff; opacity:0; pointer-events:none}
.pop{position:fixed; inset:0; z-index:66; display:grid; place-items:center; pointer-events:none}
.pop span{max-width:94vw; text-align:center; line-height:1; opacity:0; white-space:nowrap; font-family:var(--f-disp); font-size:13vh;
  background:linear-gradient(180deg,#fff 0%,#ffe36b 40%,#ff8a00 60%,#fff2a0 100%); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 6px 0 #c3005a) drop-shadow(0 0 28px var(--hot))}
.pop span.go{animation:popIn 1.25s cubic-bezier(.2,1.4,.4,1) both}
@keyframes popIn{0%{transform:scale(4) rotate(-8deg); opacity:0} 14%{transform:scale(1) rotate(-4deg); opacity:1} 78%{transform:scale(1.06) rotate(-4deg); opacity:1} 100%{transform:scale(1.6) rotate(-4deg); opacity:0}}
.ring{position:fixed; z-index:64; width:40px; height:40px; margin:-20px 0 0 -20px; border-radius:50%; pointer-events:none; border:6px solid #fff}

.vehicles{position:fixed; inset:0; z-index:62; pointer-events:none; overflow:hidden}
.veh{position:absolute; left:0; top:0; will-change:transform}
.veh svg{display:block; width:100%; height:auto; overflow:visible}
.veh .rotor{transform-box:fill-box; transform-origin:center; animation:rotor .07s linear infinite}
@keyframes rotor{50%{transform:scaleX(.12)}}
.veh .trotor{transform-box:fill-box; transform-origin:center; animation:spin .1s linear infinite}
.veh .wheel{transform-box:fill-box; transform-origin:center; animation:spin .18s linear infinite}
.veh .flame{transform-box:fill-box; transform-origin:right center; animation:flame .08s steps(2) infinite}
@keyframes flame{50%{transform:scaleX(.55)}}
.veh .bt{transform-box:fill-box; transform-origin:center}
.veh.flip .bt{transform:scaleX(-1)}

.party{position:fixed; inset:0; z-index:50; display:grid; place-items:center; overflow:hidden; background:#2a0018}
.party.vibe .party-inner{animation:vibe .045s linear infinite}
.party::before{content:""; position:absolute; inset:0; pointer-events:none; border:1.2vh solid #ff2e7e; box-shadow:inset 0 0 5vh 1.5vh #ff2e7e; animation:hue .6s linear infinite}
.party-inner{position:relative; display:grid; grid-template-columns:auto auto; align-items:center; gap:5vh 6vh; perspective:1200px; padding:0 4vh}
.big55{font-family:var(--f-disp); font-size:44vh; line-height:.9; transform-style:preserve-3d; animation:spin3d 2.6s cubic-bezier(.6,0,.4,1) infinite;
  background:linear-gradient(180deg,#fffbe0 0%,#ffd84a 30%,#e08a12 52%,#fff1a0 72%,#c46d0a 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 .8vh 0 #7a0a2a) drop-shadow(0 0 4vh #ffd84a) drop-shadow(0 0 8vh var(--hot))}
@keyframes spin3d{0%{transform:rotateY(0) scale(1)} 40%{transform:rotateY(360deg) scale(1.08)} 100%{transform:rotateY(360deg) scale(1)}}
.pcol{display:flex; flex-direction:column; align-items:center; gap:2vh; text-align:center}
.badge{font-family:var(--f-led); font-weight:900; font-size:2.6vh; letter-spacing:.3em; color:var(--cyan); text-shadow:0 0 10px var(--cyan); animation:blink .4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.hb{font-family:var(--f-disp); font-size:11vh; line-height:1.05}
.hb .row{display:block; white-space:nowrap}
.hb .l{display:inline-block; color:var(--c); -webkit-text-stroke:.3vh #fff; paint-order:stroke fill; text-shadow:0 .6vh 0 rgba(0,0,0,.35), 0 0 2.5vh var(--c);
  animation:drop .7s cubic-bezier(.3,1.7,.5,1) both, wave 1.1s ease-in-out infinite; animation-delay:calc(var(--i) * .07s + .2s), calc(var(--i) * .09s + 1.2s)}
@keyframes drop{0%{transform:translateY(-120vh) rotate(-30deg)} 100%{transform:none}}
@keyframes wave{50%{transform:translateY(-1.6vh) rotate(-4deg)}}
.msg{margin:0; font-family:var(--f-disp); font-size:4.2vh; line-height:1.45; color:#fff; text-shadow:0 0 14px var(--hot), 0 .4vh 0 #6b0030}

/* ---------- pachinko-style jackpot sequence ---------- */
.reel.reach{box-shadow:inset 0 0 0 5px #ff2e2e, inset 0 0 40px rgba(255,46,46,.7)}
.reel.reach::before{content:""; position:absolute; inset:0; z-index:2; pointer-events:none; box-shadow:inset 0 0 0 5px #ffd23a; animation:blink .18s steps(2) infinite}
.cutin{position:fixed; inset:0; z-index:68; pointer-events:none; display:grid; place-items:center; overflow:hidden}
.cutin .band{width:150vw; height:24vh; transform:rotate(-7deg); display:grid; place-items:center;
  background:linear-gradient(90deg,#000,var(--bandc,#c3001a) 18%,#ff3b3b 50%,var(--bandc,#c3001a) 82%,#000); box-shadow:0 0 0 1vh #ffd23a, 0 0 0 1.6vh #000, 0 0 8vh #ff2e2e}
.cutin .band span{font-family:var(--f-disp); font-size:13vh; line-height:1; white-space:nowrap; color:#fff; -webkit-text-stroke:.5vh #000; paint-order:stroke fill; text-shadow:0 .8vh 0 #000, 0 0 4vh #ffd23a}
.push{position:fixed; inset:0; z-index:69; display:grid; place-items:center; overflow:hidden; background:radial-gradient(circle, rgba(90,0,0,.35), rgba(0,0,0,.88) 68%)}
.push::before{content:""; position:absolute; inset:-60%; background:repeating-conic-gradient(rgba(255,210,58,.22) 0 8deg, transparent 8deg 16deg); animation:spin 3s linear infinite}
.push-inner{position:relative; display:grid; justify-items:center; gap:4vh}
.pbtn{position:relative; width:84vh; height:46vh; animation:pbeat .34s ease-in-out infinite}
@keyframes pbeat{50%{transform:scale(1.05)}}
.pb-base{position:absolute; left:1vh; right:1vh; bottom:0; height:10vh; border-radius:3vh; background:linear-gradient(180deg,#3a3a42,#0a0a0d 60%,#000); box-shadow:0 2.5vh 5vh rgba(0,0,0,.7)}
.pb-body{position:absolute; left:4vh; right:4vh; bottom:5vh; height:19vh; border-radius:0 0 3vh 3vh; overflow:hidden;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.95) 0 .45vh, rgba(190,210,235,.35) .45vh 1.3vh, rgba(255,255,255,.75) 1.3vh 1.7vh, rgba(120,140,170,.35) 1.7vh 2.5vh),
    linear-gradient(180deg,#f2f8ff,#c4d4e6 55%,#8ea4bc);
  box-shadow:inset 0 -2vh 2.5vh rgba(0,20,60,.3), inset 0 .8vh .8vh rgba(255,255,255,.9), inset 1.5vh 0 2vh rgba(255,255,255,.5), inset -1.5vh 0 2vh rgba(0,0,0,.2)}
.pb-body::after{content:""; position:absolute; top:0; bottom:0; width:30%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent); animation:pbsweep 1.1s linear infinite}
@keyframes pbsweep{from{left:-35%} to{left:105%}}
.pb-top{position:absolute; left:0; right:0; top:-8vh; height:30vh; transform:perspective(70vh) rotateX(42deg); transform-origin:50% 100%; border-radius:4.5vh;
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.75) 0 .35vh, transparent .35vh 1.5vh),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.75) 0 .35vh, transparent .35vh 1.5vh),
    radial-gradient(120% 90% at 50% 40%, #ffffff, #dbe8f5 55%, #a9bdd2);
  box-shadow:inset 0 0 0 .7vh rgba(255,255,255,.95), inset 0 0 0 1.4vh rgba(170,195,220,.6), inset 0 0 4vh rgba(90,130,180,.5), 0 0 7vh rgba(255,255,255,.55)}
.pb-plate{position:absolute; left:13%; right:13%; top:17%; bottom:20%; display:grid; place-items:center; background:#070707; border-radius:1.5vh 1.5vh 45% 45% / 1.5vh 1.5vh 22% 22%;
  box-shadow:0 0 0 .4vh #222, inset 0 0 2vh #000}
.pb-plate b{display:block; transform:skewX(-10deg); font-family:var(--f-disp); font-weight:400; font-size:15vh; line-height:1; letter-spacing:.02em;
  background:repeating-linear-gradient(180deg,#ff4a3a 0 .7vh,#c80010 .7vh 1vh); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 1.2vh rgba(255,40,30,.9)); animation:pbglow .34s steps(2) infinite}
@keyframes pbglow{50%{filter:drop-shadow(0 0 .3vh rgba(255,40,30,.5)) brightness(.7)}}
.push.pressed .pbtn{animation:none; transform:translateY(3.5vh) scale(.97)}
.push.pressed .pb-top,.push.pressed .pb-body{filter:brightness(1.6) saturate(1.2)}
.push.pressed .pb-plate b{animation:none; filter:drop-shadow(0 0 3vh #ff2a1a) brightness(1.5)}
.ptext{font-family:var(--f-disp); font-size:7.5vh; color:#ffd23a; -webkit-text-stroke:.35vh #000; paint-order:stroke fill; text-shadow:0 0 3vh #ff2e2e; animation:blink .3s steps(2) infinite; white-space:nowrap}
.oatari{position:fixed; inset:0; z-index:67; pointer-events:none; display:grid; place-items:center; overflow:hidden}

.medal55::before{content:""; position:absolute; inset:5vh; border-radius:50%; background:repeating-conic-gradient(rgba(255,255,255,.25) 0 6deg, transparent 6deg 12deg); animation:spin 2s linear infinite}

body.rainbow .scene{animation:hue .45s linear infinite}

  background:repeating-conic-gradient(from 0deg, #ffffff 0 1.5deg, #ffd23a 1.5deg 4deg, #ff7a00 4deg 6.5deg, #ff2e9a 6.5deg 9deg, #fff3a0 9deg 11deg, #ff4fd0 11deg 13deg)}
.burstcore{position:absolute; inset:0; background:radial-gradient(circle at 50% 50%, #fff 0 6%, rgba(255,255,255,.75) 16%, rgba(255,210,90,.25) 38%, rgba(140,0,70,.45) 85%)}
.zg-ticker{position:absolute; top:5vh; left:0; right:0; height:7vh; overflow:hidden; display:flex; align-items:center;

.zg-ticker div{display:flex; flex:none; white-space:nowrap; animation:ticker 2.2s linear infinite}
.zg-ticker span{font-family:var(--f-disp); font-size:4.6vh; padding:0 4vh; color:#ffb020; text-shadow:0 0 1.5vh #ff6a00; -webkit-text-stroke:.15vh #3a1000}
@keyframes ticker{to{transform:translateX(-50%)}}
.zg-row{position:relative; display:flex; align-items:center; justify-content:center; margin-top:6vh}
.em{position:relative; flex:none; width:min(86vh,50vw); opacity:0}

.em .ein{filter:drop-shadow(0 0 2.5vh rgba(255,220,90,.95)) drop-shadow(0 1.5vh 2vh rgba(80,0,0,.5))}

@keyframes emsway{50%{transform:translateY(-1.8vh) scale(1.04)}}
.em svg{display:block; width:100%; height:auto; overflow:visible}
.em .shine{animation:emshine 1.4s linear infinite}
@keyframes emshine{0%{transform:translateX(-120%)} 60%,100%{transform:translateX(120%)}}
.party-bg{position:absolute; inset:0; overflow:hidden; filter:brightness(.62) saturate(1.2)}
.party-bg .burstbg{animation-duration:9s}
.party.three{background:transparent}
.party.three .party-bg{display:none}
.party.three .big55,.party.three .hb,.party.three .badge,.party.three::before,.party.three .party-inner{display:none}
.party.three{place-items:end center}
.party.three .pcol{gap:.6vh}
.party.three .msg{font-size:3.4vh; line-height:1.3; padding:1vh 3vh; border-radius:2vh; background:rgba(20,0,30,.55); box-shadow:0 0 0 .3vh rgba(255,210,58,.8)}

@media (prefers-reduced-motion: reduce){
  .burstbg, .zg-ticker div, .em.on .ein, .em .shine,

}

function chooseTarget(i){
  const r = reels[i], base = Math.floor(r.o);
  const last = reels.filter((x, k) => k !== i && x.fin != null).length === 2;
  const os = t => reels.map((x, k) => k === i ? t : x.fin);
  let ok;
  if (game.bonus) ok = t => symAt(i, t, 1) === SPECIAL[i];
  else if (game.role === 'cherry') ok = t => i !== 0 || symAt(0, t, 1) === 'cherry';
  else if (game.role) ok = t => symAt(i, t, LINES[game.line][i]) === game.role;
  else ok = t => i !== 0 || ![0,1,2].some(row => symAt(0, t, row) === 'cherry');
  const okAll = t => {
    if (!ok(t)) return false;
    if (!last || game.bonus) return true;
    const w = evalWins(os(t));
    if (w.some(x => x.s === 'hbd')) return false;
    return game.role ? w.every(x => x.s === game.role) : w.length === 0;
  };
  for (const lim of [4, r.N*2]) for (let k = 0; k <= lim; k++) if (okAll(base - k)) return base - k;
  for (let k = 0; k <= r.N*2; k++) if (!evalWins(os(base - k)).some(x => x.s === 'hbd')) return base - k;
  return base;
}

  r.fin = t; r.state = 'stopping';

  const from = game.bonus ? t + Math.min(r.o - t, 1.6) : r.o;

  r.slow = false;
  sfx.stop(); press(stopBtns[i]);
  spinLevel(reels.filter(x => x.state === 'spin').length);
  leds();
}

function flyers(geo, mat, max, colors){
  const mesh = new THREE.InstancedMesh(geo, mat, max);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); mesh.frustumCulled = false; scene.add(mesh);
  const items = Array.from({length:max}, () => ({on:false, p:V(0,0,0), v:V(0,0,0), q:new THREE.Quaternion(), ax:V(1,0,0), w:0, drag:1, g:9, sway:0}));
  const Z = new THREE.Matrix4().makeScale(0, 0, 0), dm = new THREE.Object3D(), qd = new THREE.Quaternion();
  for (let i = 0; i < max; i++){ mesh.setMatrixAt(i, Z); if (colors) mesh.setColorAt(i, new THREE.Color(colors[i % colors.length])); }
  let head = 0;
  return {
    add(p, v, o = {}){ const c = items[head]; head = (head + 1) % max; c.on = true; c.p.copy(p); c.v.copy(v); c.ax.set(rnd(-1,1), rnd(-1,1), rnd(-1,1)).normalize();
      c.w = o.w ?? rnd(6, 16); c.drag = o.drag ?? 1; c.g = o.g ?? 9; c.sway = o.sway ?? 0; c.q.setFromEuler(new THREE.Euler(rnd(0,6), rnd(0,6), rnd(0,6))); },

      c.v.y -= c.g*dt; c.v.multiplyScalar(Math.pow(c.drag, dt*60));

      qd.setFromAxisAngle(c.ax, c.w*dt); c.q.premultiply(qd);
      if (c.p.y < -9){ c.on = false; mesh.setMatrixAt(i, Z); continue; }
      dm.position.copy(c.p); dm.quaternion.copy(c.q); dm.updateMatrix(); mesh.setMatrixAt(i, dm.matrix); }
      mesh.instanceMatrix.needsUpdate = true; },
    clear(){ items.forEach((c, i) => { c.on = false; mesh.setMatrixAt(i, Z); }); mesh.instanceMatrix.needsUpdate = true; },
  };
}

// keep the whole logo on screen on narrow windows
function fitZ(){ const need = 13.4; const halfFov = Math.tan(THREE.MathUtils.degToRad(20)); return Math.max(11.8, need/(2*halfFov*camera.aspect)); }

function impact(level, x = 0, y = 0, z = 0){
  shake = Math.max(shake, level*.15);
  fovKick = Math.max(fovKick, level*1.6);
  fx.uniforms.uRadial.value = Math.max(fx.uniforms.uRadial.value, Math.min(.35, level*.06));
  fx.uniforms.uCA.value = Math.max(fx.uniforms.uCA.value, Math.min(.03, level*.005));
  bloom.strength = BLOOM + Math.min(.5, level*.1);
  flareAt(x, y, z + .8, 6 + level*2.2, .45 + level*.06);
  cb.impact && cb.impact(level);
}
function at(t, fn){ events.push({t, fn}); }
function reset(){
  for (let i = 0; i < MAXP; i++){ pLife[i] = 0; pAlpha[i] = 0; }
  coins.clear(); foil.clear();
  rings.forEach(r => r.visible = false); flares.forEach(s => s.visible = false);
  events = []; T = 0; slowUntil = 0; shake = 0; fovKick = 0;
  Object.assign(fxT, {radial:0, ca:0, lines:0, bar:0, white:0});
  ['uRadial','uCA','uLines','uBar','uWhite'].forEach(k => fx.uniforms[k].value = 0);
}
function track(){ const Z = fitZ(); return [
  [0,    V(0, 0, 3.0),        V(0, 0, 0)],
  [.35,  V(0, 0, 3.0),        V(0, 0, 0)],
  [.75,  V(0, .6, Z),         V(0, .4, 0)],
  [1.15, V(WORDS[0].x*.7, 2.2, 7.5), V(WORDS[0].x, TY + .4, 0)],
  [1.7,  V(WORDS[0].x*.5, 1.8, 9),   V(WORDS[0].x*.7, TY, 0)],
  [1.85, V(WORDS[1].x*.7, 2.2, 7.5), V(WORDS[1].x, TY + .4, 0)],
  [2.35, V(WORDS[1].x*.5, 1.8, 9),   V(WORDS[1].x*.7, TY, 0)],
  [2.5,  V(WORDS[2].x*.7, 2.2, 7.5), V(WORDS[2].x, TY + .4, 0)],
  [3.0,  V(0, 1, Z),          V(0, .4, 0)],
  [3.6,  V(0, -.4, 10.5),     V(0, -.85, 0)],
  [4.2,  V(0, -.5, 9.5),      V(0, -.85, 0)],
  [4.8,  V(0, -.3, Z + .7),   V(0, -.7, 0)],
  [6.5,  V(0, -.3, Z + 1.1),  V(0, -.7, 0)],
]; }
function sampleTrack(t){
  const k = camTrack; if (t <= k[0][0]) return [k[0][1], k[0][2]];
  for (let i = 0; i < k.length - 1; i++){ const a = k[i], b = k[i + 1];
    if (t <= b[0]){ const p = easeInOut((t - a[0])/(b[0] - a[0])); return [a[1].clone().lerp(b[1], p), a[2].clone().lerp(b[2], p)]; } }
  const l = k[k.length - 1]; return [l[1], l[2]];
}
function hideLogo(){ WORDS.forEach(w => { w.m.visible = false; w.m.userData.t0 = null; }); medal.visible = false; big55.visible = false; deco.visible = false; ribbon.visible = false; deco.userData.t0 = null; ribbon.userData.t0 = null; }
function placeLogoRest(){
  WORDS.forEach(w => { w.m.visible = true; w.m.position.copy(w.m.userData.rest); w.m.rotation.set(0, 0, 0); w.m.scale.setScalar(1); });
  medal.visible = true; medal.position.copy(MEDAL_REST); medal.rotation.set(0, 0, 0); medal.scale.setScalar(1);
  big55.visible = true; big55.position.copy(FIVE_REST); big55.rotation.set(0, 0, 0); big55.scale.setScalar(1);
  deco.visible = true; deco.scale.setScalar(1); ribbon.visible = true; ribbon.scale.set(.85, .85, 1);
}

/* ---------- jackpot timeline (~6.5 s) ---------- */
function play(callbacks){
  cb = callbacks || {}; reset();
  mode = 'jack'; active = true; cv.style.display = 'block';
  vehGroup.visible = false; logo.visible = true; hideLogo();
  bgTarget = 0; bgMat.uniforms.uInt.value = 0;
  camTrack = track();
  fx.uniforms.uBar.value = .12; fxT.bar = .12;
  core.position.set(0, 0, -3); core.scale.set(.01, .01, 1); core.material.opacity = 0;

  at(.05, () => {
    cb.rumble && cb.rumble(); cb.se && cb.se('charge');
    for (let k = 0; k < (RM ? 120 : 500); k++){ // sparks rush into the centre
      const a = Math.random()*Math.PI*2, r = rnd(5, 10), x = Math.cos(a)*r, y = Math.sin(a)*r*.6;
      spark(x, y, -3, -x/.12, -y/.12, 0, k % 3 ? '#ff4fe0' : (k % 2 ? '#6a5bff' : '#ffffff'), rnd(.05, .12), .12, 1, 0);
    }
  });
  at(.17, () => { cb.se && cb.se('flash'); fx.uniforms.uWhite.value = .35; bloom.strength = BLOOM + .4; });
  at(.35, () => {   // explosion
    cb.se && cb.se('boom');
    bgTarget = 1; fxT.bar = 0; fx.uniforms.uWhite.value = .6;
    impact(5, 0, .5, -1);
    burst(0, .5, -1, 1300, 18, PAL_GOLD); burst(0, .5, -1, 500, 10, PAL_PARTY, {shell:true, grav:1});
    ring(0, .5, -1, '#ffffff', 22, .9); ring(0, .5, -2, '#ff3aa0', 16, 1.1); ring(0, .5, -3, '#ffd23a', 12, 1.3);
    foilBurst(0, .5, -1, 260, 10);
  });
  // HAPPY / BIRTH / DAY land one by one, like reels stopping
  [[0, 1.4], [1, 2.1], [2, 2.75]].forEach(([i, t]) => {
    at(t - .3, () => { const m = WORDS[i].m; m.visible = true; m.userData.t0 = T; });
    at(t, () => { const p = WORDS[i].m.userData.rest; impact(3, p.x, p.y + .5, p.z); cb.se && cb.se('word', i);
      burst(p.x, p.y + .5, p.z, 380, 11, PAL_GOLD); ring(p.x, p.y + .5, p.z + .3, '#ffd23a', 9, .7); foilBurst(p.x, p.y + .5, p.z, 60, 6); });
  });
  at(3.05, () => { medal.visible = true; medal.userData.t0 = T; fxT.lines = .4; });
  at(3.4, () => { cb.se && cb.se('medal'); impact(3, 0, -.8, 0); ring(0, -.85, 0, '#ffffff', 16, .9); deco.visible = true; deco.userData.t0 = T; });
  at(3.75, () => { big55.visible = true; big55.userData.t0 = T; });
  at(4.0, () => {  // 55 slams: the biggest hit
    cb.se && cb.se('55'); impact(6, 0, -.85, 1); slowUntil = T + .3; fx.uniforms.uWhite.value = .45;
    burst(0, -.85, 1, 1100, 17, PAL_GOLD); burst(0, -.85, 1, 400, 11, PAL_PARTY, {shell:true, grav:1});
    ring(0, -1, .5, '#ffffff', 24, 1.1); ring(0, -1, 0, '#ff3aa0', 18, 1.3);
    coinBurst(0, -.85, 1, 160, 10); foilBurst(0, -1, 1, 400, 12);
    fxT.lines = 1; fxT.bar = .06;
  });
  at(4.7, () => { fxT.lines = .25; fxT.bar = 0; SWEEP.value = -14; ribbon.visible = true; ribbon.userData.t0 = T; cb.se && cb.se('ribbon'); });
  at(5.4, () => { foilBurst(-7, -4, 2, 200, 13); foilBurst(7, -4, 2, 200, 13); coinBurst(0, -3, 1, 120, 9); SWEEP.value = -14; });
  at(5.7, () => { cb.rush && cb.rush(); });
  at(6.4, () => { cb.party && cb.party(); });
  last = performance.now();
  requestAnimationFrame(loop);
}

function updateJack(dt){
  if (T < .35){
    // light gathers into one point (accelerating), then the point pops into a star
    const p = clamp((T - .05)/.12, 0, 1), q = p*p*p;
    const pop = clamp((T - .17)/.06, 0, 1), popS = pop < 1 ? easeOutCubic(pop) : 1 - (T - .23)*1.5;
    const w = (1 - q)*16 + .3 + popS*2.2, h = (1 - q)*1.2 + .2 + popS*3.2;
    core.scale.set(w, h, 1); core.material.opacity = T < .05 ? 0 : 1; fx.uniforms.uVig.value = .8;
  } else { const p = clamp((T - .35)/.12, 0, 1); core.scale.set(16 + p*10, 4*(1 - p) + .01, 1); core.material.opacity = 1 - p; fx.uniforms.uVig.value = 0; }
  WORDS.forEach((w, i) => {
    const m = w.m; if (!m.visible || m.userData.t0 == null) return;
    const p = clamp((T - m.userData.t0)/.3, 0, 1), rest = m.userData.rest;
    m.position.set(rest.x, rest.y + (1 - easeOutCubic(p))*1.5, rest.z + (1 - p)*12);
    m.scale.setScalar(p < 1 ? 2.6 - 1.6*easeOutCubic(p) : 1 + Math.max(0, .1 - (T - m.userData.t0 - .3)*.5));
    m.rotation.set((1 - p)*-.5, 0, (1 - p)*(i - 1)*.3);
  });
  if (medal.visible && medal.userData.t0 != null){
    const p = clamp((T - medal.userData.t0)/.35, 0, 1);
    medal.position.set(0, MEDAL_REST.y, lerp(-30, MEDAL_REST.z, easeOutCubic(p)));
    medal.rotation.set(0, (1 - easeOutCubic(p))*Math.PI*3, 0);
    medal.scale.setScalar(.4 + .6*easeOutBack(p));
  }
  if (big55.visible && big55.userData.t0 != null){
    const p = clamp((T - big55.userData.t0)/.25, 0, 1);
    big55.position.set(0, FIVE_REST.y, FIVE_REST.z + (1 - p)*14);
    big55.scale.setScalar(p < 1 ? 3 - 2*easeOutCubic(p) : 1 + Math.max(0, .12 - (T - big55.userData.t0 - .25)*.5));
    big55.rotation.set((1 - p)*-.3, 0, 0);
  }
  if (deco.visible && deco.userData.t0 != null){ const p = clamp((T - deco.userData.t0)/.5, 0, 1); deco.scale.setScalar(Math.max(.01, easeOutBack(p))); }
  if (ribbon.visible && ribbon.userData.t0 != null){ const p = clamp((T - ribbon.userData.t0)/.4, 0, 1); ribbon.scale.set(Math.max(.01, easeOutBack(p))*.85, .85, 1); }
  if (T > 4.1 && Math.random() < .5){ glitter(0, .2, 1.4, 7, 3.8, 2); }
  const [pos, look] = sampleTrack(T);
  camPos.copy(pos); camLook.copy(look);
}

/* ---------- party: the logo stays centred and still; vehicles and fireworks go wild around it ---------- */
function party(name){
  mode = 'party'; pT = 0; nextFw = 0; punchT = 1.5; fx.uniforms.uVig.value = 0; cb.se && cb.se('cheer');
  logo.visible = true; placeLogoRest(); vehGroup.visible = true;
  bgTarget = 1; core.material.opacity = 0;
  fxT.white = 0; fx.uniforms.uWhite.value = .4; fxT.radial = 0; fxT.lines = .12; fxT.bar = 0;
  const label = (name || '祝55歳').slice(0, 6);
  { const old = ribbonMat.map; ribbonMat.map = ribbonTex(name ? name + 'さん 55歳 おめでとう!' : '55歳 おめでとうございます!'); ribbonMat.needsUpdate = true; old.dispose(); }
  helis.forEach((h, i) => { const old = h.userData.bmat.map; h.userData.bmat.map = bannerTex(label); h.userData.bmat.needsUpdate = true; old.dispose();
    h.userData.ph = i*Math.PI/2; h.userData.sp = rnd(.3, .42)*(i % 2 ? -1 : 1); h.userData.prev = null; });
  const hw = viewHalfWidth(0);
  cars.forEach((c, i) => { const d = i % 2 ? -1 : 1; Object.assign(c.userData, {dir:d, speed:rnd(13, 20), vy:0, spin:0, axis:'x'});
    c.position.set(-d*(hw + 6 + i*4), -4.6, rnd(-7, -3)); c.rotation.set(0, d > 0 ? 0 : Math.PI, 0); });
}
function updateParty(dt){
  pT += dt;
  const hw = viewHalfWidth(0);
  const floor = -4.6;
  cars.forEach(c => {
    const u = c.userData;
    c.position.x += u.dir*u.speed*dt;
    u.vy -= 22*dt; c.position.y += u.vy*dt;
    if (c.position.y <= floor){
      c.position.y = floor;
      if (u.spin){ c.rotation.x = 0; c.rotation.z = 0; u.spin = 0; burst(c.position.x, floor + .2, c.position.z, 120, 6, ['#ffd23a','#ff8a20','#ffffff']); cb.thump && cb.thump(); shake = Math.max(shake, .2); }
      u.vy = Math.random() < .03 ? rnd(10, 15) : 0;
      if (u.vy){ u.spin = rnd(9, 13)*(Math.random() < .5 ? 1 : -1); u.axis = Math.random() < .5 ? 'x' : 'z'; }
    }
    if (u.spin) c.rotation[u.axis] += u.spin*dt;
    u.wheels.forEach(w => w.rotation.z -= u.speed*dt*2.4);
    u.flames.forEach(f => f.scale.set(1, rnd(.5, 1.5), 1));
    if (Math.random() < .8){ const back = V(-2.8, .5, rnd(-.3, .3)).applyMatrix4(c.matrixWorld); spark(back.x, back.y, back.z, -u.dir*rnd(2, 5), rnd(0, 1.5), rnd(-1, 1), Math.random() < .5 ? '#ff9a2e' : '#ffd23a', rnd(.08, .2), rnd(.2, .5), .9, 1); }
    if ((u.dir > 0 && c.position.x > hw + 9) || (u.dir < 0 && c.position.x < -hw - 9)){
      u.dir *= -1; u.speed = rnd(13, 22); c.position.z = Math.random() < .25 ? rnd(2.5, 4) : rnd(-7, -3); c.rotation.set(0, u.dir > 0 ? 0 : Math.PI, 0); u.spin = 0;
      if (Math.random() < .5){ u.vy = rnd(10, 15); u.spin = rnd(9, 12)*(Math.random() < .5 ? 1 : -1); u.axis = 'x'; }
    }
  });
  helis.forEach((h, i) => {
    const u = h.userData, t = pT*u.sp + u.ph;
    const p = V(Math.sin(t)*(hw*.85), 3.6 + Math.sin(t*2 + i)*.6 + (i % 2)*.5, -6 + Math.cos(t)*3.5);
    if (u.prev){
      const v = p.clone().sub(u.prev), yaw = Math.atan2(-v.z, v.x);
      const turn = ((yaw - (u.yaw ?? yaw) + Math.PI*3) % (Math.PI*2)) - Math.PI;
      u.yaw = yaw; u.bank = lerp(u.bank || 0, clamp(-turn*25, -.5, .5), .1);
      h.rotation.set(u.bank, yaw, -.2);
    }
    u.prev = p.clone(); h.position.copy(p);
    u.rotor.rotation.y += dt*42; u.trotor.rotation.z += dt*60;
    u.strobe.visible = (pT*2 + i*.3) % 1 < .12;
  });
  if (pT > nextFw){ nextFw = pT + rnd(.3, .6); if (Math.random() < .45) cb.se && cb.se('firework');
    const x = rnd(-hw*.95, hw*.95), y = rnd(2, 5.5), z = rnd(-14, -6);
    burst(x, y, z, 450, rnd(6, 9), [PAL_PARTY[Math.floor(Math.random()*8)], '#ffffff', PAL_PARTY[Math.floor(Math.random()*8)]], {shell:true, grav:1.6, life:1.3});
  }
  if (pT > punchT){ punchT = pT + rnd(2.4, 3.4); fovKick = 4; fx.uniforms.uRadial.value = .12; fx.uniforms.uCA.value = .008; SWEEP.value = -14; foilBurst(0, -1, 1.5, 120, 9); }
  if (Math.random() < .35) coinRain(1, hw);
  foilRain(Math.random() < .6 ? 2 : 1, hw*1.1);
  if (Math.random() < .4) glitter(0, .2, 1.4, 7, 3.8, 2);
  const Z = fitZ() + .8;
  camPos.set(Math.sin(pT*.25)*.5, -.3 + Math.sin(pT*.4)*.15, Z + .4); camLook.set(0, -.7, 0);
}

/* ---------- loop ---------- */
function loop(now){
  if (!active) return;
  const rdt = Math.min(.05, (now - last)/1000); last = now;
  const dt = rdt*(T < slowUntil ? .22 : 1);
  T += dt;
  while (events.length){ const i = events.findIndex(e => e.t <= T); if (i < 0) break; events.splice(i, 1)[0].fn(); }
  bgMat.uniforms.uInt.value += (bgTarget - bgMat.uniforms.uInt.value)*Math.min(1, rdt*8);
  bgMat.uniforms.uTime.value += dt; pMat.uniforms.uTime.value += rdt; fx.uniforms.uTime.value += rdt; TIME.value += rdt;
  bloom.strength += (BLOOM - bloom.strength)*Math.min(1, rdt*3);
  pl1.position.set(Math.cos(T*1.4)*6, 2 + Math.sin(T*2)*1.5, 5); pl2.position.set(Math.cos(T*1.4 + Math.PI)*6, -1 + Math.sin(T*1.7)*1.5, 5);
  SWEEP.value += rdt*16; if (SWEEP.value > 18) SWEEP.value = -18;
  if (logo.visible) stepGlints(TIME.value);
  stars.forEach(st => { st.scale.setScalar(.55 + .45*Math.abs(Math.sin(TIME.value*3 + st.userData.ph))); st.rotation.z = TIME.value*.8 + st.userData.ph; });
  if (mode === 'jack') updateJack(dt); else if (mode === 'party') updateParty(rdt);
  const U = fx.uniforms, k = Math.min(1, rdt*5);
  U.uRadial.value += (fxT.radial - U.uRadial.value)*k; U.uCA.value += (fxT.ca - U.uCA.value)*k;
  U.uLines.value += (fxT.lines - U.uLines.value)*k; U.uBar.value += (fxT.bar - U.uBar.value)*Math.min(1, rdt*6);
  U.uWhite.value += (fxT.white - U.uWhite.value)*Math.min(1, rdt*4);
  if (RM){ U.uRadial.value = 0; U.uLines.value = 0; }
  camera.position.copy(camPos); camera.lookAt(camLook);
  if (shake > .001 && !RM){ camera.position.x += rnd(-1, 1)*shake; camera.position.y += rnd(-1, 1)*shake; camera.rotation.z += rnd(-1, 1)*shake*.05; }
  shake *= Math.pow(.02, rdt);
  camera.fov = 40 - fovKick; camera.updateProjectionMatrix(); fovKick *= Math.pow(.004, rdt);
  stepSparks(dt); coins.step(dt, T); foil.step(dt, T); stepRings(dt); stepFlares(rdt);
  composer.render(rdt);
  requestAnimationFrame(loop);
}
function stop(){ active = false; mode = 'off'; cv.style.display = 'none'; reset(); }

// warm up shaders once so the first jackpot does not hitch
cv.style.display = 'block'; cv.style.opacity = '0';
logo.visible = true; placeLogoRest(); vehGroup.visible = true;
camera.position.set(0, 0, 14); camera.lookAt(0, 0, 0);
renderer.compile(scene, camera); composer.render(.016);
hideLogo();
cv.style.display = 'none'; cv.style.opacity = '1';

window.J3D = {ready:true, play, party, stop, get t(){ return T; }};
} catch (err) {
  console.warn('3D jackpot unavailable, using 2D fallback', err);
  window.J3D = {ready:false};
}

</script>
